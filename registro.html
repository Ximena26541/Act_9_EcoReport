<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoReport | Registro</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-leaf"></i>
EcoReport
</div>


<ul class="nav-links">

<li>
<a href="index.html">Inicio</a>
</li>

<li>
<a href="login.html">Ingresar</a>
</li>

<li>
<a class="active" href="registro.html">
Registro
</a>
</li>


</ul>

</nav>

</header>




<main class="container">


<section class="form-box">


<h1>
Crear cuenta
</h1>


<form id="registroForm">


<label>
Nombre completo
</label>

<input 
type="text"
id="nombre"
placeholder="Nombre del usuario"
required>



<label>
Correo electrónico
</label>

<input 
type="email"
id="correo"
placeholder="correo@ejemplo.com"
required>



<label>
Tipo de usuario
</label>


<select>

<option>
Ciudadano
</option>

<option>
Personal ambiental
</option>

</select>



<label>
Contraseña
</label>


<input
type="password"
id="password"
placeholder="****"
required>



<button class="btn">

Registrarme

</button>



</form>


<p>

¿Ya tienes cuenta?

<a href="login.html">
Iniciar sesión
</a>

</p>


</section>


</main>




<footer>

<p>
EcoReport | Plataforma ambiental
</p>

</footer>



<script src="js/validaciones.js"></script>

</body>

</html>
