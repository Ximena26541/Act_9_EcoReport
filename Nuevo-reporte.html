<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>EcoReport | Nuevo reporte</title>


<link rel="stylesheet" href="styles.css">


</head>


<body>



<header>


<nav class="navbar">


<div class="logo">
<i class="fa-solid fa-leaf"></i>
EcoReport
</div>


<ul class="nav-links">


<li>
<a href="dashboard.html">
Panel
</a>
</li>


<li>
<a class="active" href="nuevo-reporte.html">
Nuevo reporte
</a>
</li>


</ul>


</nav>


</header>




<main class="container">


<section class="form-box">


<h1>
Registrar problema ambiental
</h1>



<form>


<label>
Tipo de problema
</label>


<select>

<option>
Basura
</option>

<option>
Desperdicio de agua
</option>

<option>
Contaminación
</option>

</select>



<label>
Ubicación
</label>


<input 
type="text"
placeholder="Zona o dirección">


<label>
Descripción
</label>


<textarea 
rows="5"
placeholder="Describe el problema">
</textarea>



<label>
Agregar evidencia
</label>


<input 
type="file">



<button class="btn">

Enviar reporte

</button>



</form>


</section>


</main>




<footer>

<p>
EcoReport | Cuidando el medio ambiente
</p>


</footer>



</body>


</html>
